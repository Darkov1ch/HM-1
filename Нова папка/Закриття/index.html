<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анімація книги</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="book" id="book">
        <div class="cover" id="book-cover">
            <img src="image.png" alt="Зроби це зараз - Браян Трейсі">
        </div>
        <div class="pages" id="book-pages">
            <div class="click-area left"></div>   <!-- Ліва частина -->
            <div class="click-area right"></div>  <!-- Права частина -->
            <div class="content" id="page-content">
                <h1>Зміст книги</h1>
                <p>Це приклад тексту, який з’являється всередині книги.</p>
            </div>
        </div>
    </div>
</body>
</html>
